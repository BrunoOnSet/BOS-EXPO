name: Conversion des fiches techniques en JPG
on:
  push:
    paths:
      - .github/workflows/convert-fiches-jpg.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le moteur SVG et JPG
        run: python -m pip install --quiet cairosvg pillow
      - name: Créer les deux JPG depuis les illustrations actuelles
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image
          paths = [
            Path("assets/triangle-exposition.svg"),
            Path("assets/fiche-filtres-nd.svg"),
          ]
          for src in paths:
              assert src.exists(), f"Fiche source manquante : {src}"
              png = cairosvg.svg2png(url=str(src), output_width=(1448 if "filtres" in src.name else 1200))
              with Image.open(BytesIO(png)) as img:
                  jpg = img.convert("RGB")
                  output = src.with_suffix(".jpg")
                  jpg.save(output, format="JPEG", quality=93, subsampling=0, optimize=True)
                  print(f"Created: {output} [{output.stat().st_size} octets], {jpg.width}x{jpg.height}")
          PY
      - name: Publier les JPG sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/triangle-exposition.jpg assets/fiche-filtres-nd.jpg
          git commit -m "EXPO: fournir les fiches techniques en JPG remplaçables" || exit 0
          git push
