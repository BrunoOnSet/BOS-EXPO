</g>
<path d="M920 785Q620 858 305 786" stroke="#b88d3d" stroke-width="5" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
<path d="M252 697Q280 392 548 208" stroke="#b88d3d" stroke-width="5" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
<g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" fill="#262321">
<text x="62" y="794" font-size="35">OUVERTURE (DIAPH)</text>
<path d="M55 814h397" stroke="#9ebac6" stroke-width="2"/>
<text x="67" y="858" font-size="22">Profondeur de champ</text><text x="67" y="889" font-size="22">+ luminosité</text>
<text x="952" y="794" font-size="38">VITESSE</text><path d="M950 814h222" stroke="#9ebac6" stroke-width="2"/>
<text x="952" y="858" font-size="22">Flou de mouvement</text><text x="952" y="889" font-size="22">+ luminosité</text>
</g></svg>