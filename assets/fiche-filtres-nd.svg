  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#ffe49a" stop-opacity=".9"/><stop offset="1" stop-color="#e4d8b9" stop-opacity=".2"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
